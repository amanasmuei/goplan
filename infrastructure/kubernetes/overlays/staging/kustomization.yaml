apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: goplan-staging

namePrefix: staging-

resources:
  - ../../base

patches:
  - path: patches/deployment-replicas.yaml
  - path: patches/ingress-host.yaml

configMapGenerator:
  - name: goplan-config
    behavior: merge
    literals:
      - log-level=debug
      - allow-origins=https://staging.goplan.yourcompany.com

images:
  - name: goplan/api
    newTag: develop
  - name: goplan/frontend
    newTag: develop

commonLabels:
  environment: staging
