apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: goplan-ingress
  namespace: goplan
  labels:
    app.kubernetes.io/name: goplan
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - goplan.example.com
      secretName: goplan-tls
  rules:
    - host: goplan.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: goplan-api
                port:
                  number: 80
          - path: /swagger
            pathType: Prefix
            backend:
              service:
                name: goplan-api
                port:
                  number: 80
          - path: /health
            pathType: Exact
            backend:
              service:
                name: goplan-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: goplan-frontend
                port:
                  number: 80
