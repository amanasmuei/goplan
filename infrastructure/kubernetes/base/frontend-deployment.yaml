apiVersion: apps/v1
kind: Deployment
metadata:
  name: goplan-frontend
  namespace: goplan
  labels:
    app: goplan-frontend
    app.kubernetes.io/name: goplan-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: goplan-frontend
  template:
    metadata:
      labels:
        app: goplan-frontend
        app.kubernetes.io/name: goplan-frontend
    spec:
      containers:
        - name: frontend
          image: goplan/frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: goplan-frontend
  namespace: goplan
  labels:
    app: goplan-frontend
    app.kubernetes.io/name: goplan-frontend
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: goplan-frontend
