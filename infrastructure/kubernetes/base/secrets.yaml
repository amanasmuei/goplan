apiVersion: v1
kind: Secret
metadata:
  name: goplan-db-credentials
  namespace: goplan
  labels:
    app.kubernetes.io/name: goplan
type: Opaque
stringData:
  host: "REPLACE_WITH_DB_HOST"
  port: "5432"
  username: "REPLACE_WITH_DB_USER"
  password: "REPLACE_WITH_DB_PASSWORD"
  database: "goplan"
---
apiVersion: v1
kind: Secret
metadata:
  name: goplan-jwt-secret
  namespace: goplan
  labels:
    app.kubernetes.io/name: goplan
type: Opaque
stringData:
  secret: "REPLACE_WITH_JWT_SECRET"
