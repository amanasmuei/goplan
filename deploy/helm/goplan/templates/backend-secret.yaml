{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "goplan.fullname" . }}-backend-secrets
  namespace: {{ include "goplan.namespace" . }}
  labels:
    {{- include "goplan.backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.backend.secrets.databaseUrl | quote }}
  REDIS_URL: {{ .Values.backend.secrets.redisUrl | quote }}
  JWT_SECRET: {{ .Values.backend.secrets.jwtSecret | quote }}
  CLAUDE_API_KEY: {{ .Values.backend.secrets.claudeApiKey | quote }}
  {{- if .Values.backend.secrets.sendgridApiKey }}
  SENDGRID_API_KEY: {{ .Values.backend.secrets.sendgridApiKey | quote }}
  {{- end }}
{{- end }}
