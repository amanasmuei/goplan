# ===========================================
# GoPlan Backend Kubernetes Configuration
# ===========================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: goplan-backend-config
  namespace: goplan
  labels:
    app: goplan
    component: backend
data:
  # Server Configuration
  PORT: "8080"
  HOST: "0.0.0.0"
  ENV: "production"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"

  # Database Configuration (connection string in secret)
  DATABASE_MAX_CONNS: "25"
  DATABASE_MIN_CONNS: "5"
  DATABASE_MAX_IDLE_TIME: "5m"

  # Redis Configuration
  REDIS_DB: "0"

  # Authentication
  JWT_ACCESS_EXPIRY: "1h"
  JWT_REFRESH_EXPIRY: "7d"
  BCRYPT_COST: "12"

  # AI Configuration
  CLAUDE_MODEL: "claude-sonnet-4-20250514"
  AI_MAX_TOKENS: "4096"
  AI_TIMEOUT: "30s"
  AI_ENABLED: "true"

  # Security
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS: "100"
  RATE_LIMIT_WINDOW: "1m"

  # Observability
  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: "goplan-api"

---
# IMPORTANT: Do NOT store real secrets in version control.
# Use one of the following approaches:
#   - kubectl create secret generic goplan-backend-secrets --from-env-file=.env.production
#   - Sealed Secrets: kubeseal < secret.yaml > sealed-secret.yaml
#   - External Secrets Operator with AWS Secrets Manager / HashiCorp Vault
#
# Required secret keys:
#   DATABASE_URL, REDIS_URL, JWT_SECRET, CLAUDE_API_KEY
apiVersion: v1
kind: Secret
metadata:
  name: goplan-backend-secrets
  namespace: goplan
  labels:
    app: goplan
    component: backend
type: Opaque
stringData:
  # WARNING: Populate these via external secret management, NOT in this file.
  DATABASE_URL: ""
  REDIS_URL: ""
  JWT_SECRET: ""
  CLAUDE_API_KEY: ""
  SENDGRID_API_KEY: ""

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goplan-backend
  namespace: goplan
  labels:
    app: goplan
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: goplan
      component: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: goplan
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: goplan-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: backend
          image: ghcr.io/goplan/goplan-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: goplan-backend-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: goplan-backend-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: goplan-backend-secrets
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: goplan-backend-secrets
                  key: JWT_SECRET
            - name: CLAUDE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: goplan-backend-secrets
                  key: CLAUDE_API_KEY
            - name: SENDGRID_API_KEY
              valueFrom:
                secretKeyRef:
                  name: goplan-backend-secrets
                  key: SENDGRID_API_KEY
                  optional: true
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: goplan
                    component: backend
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: goplan
              component: backend

---
apiVersion: v1
kind: Service
metadata:
  name: goplan-backend
  namespace: goplan
  labels:
    app: goplan
    component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: goplan
    component: backend

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: goplan-backend
  namespace: goplan
  labels:
    app: goplan
    component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: goplan-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Max

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: goplan-backend
  namespace: goplan
  labels:
    app: goplan
    component: backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: goplan
      component: backend

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: goplan-backend
  namespace: goplan
  labels:
    app: goplan
    component: backend
