# ===========================================
# GoPlan Frontend Kubernetes Configuration
# ===========================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: goplan-frontend-config
  namespace: goplan
  labels:
    app: goplan
    component: frontend
data:
  NODE_ENV: "production"
  NEXT_PUBLIC_API_URL: "https://api.goplan.io/api/v1"
  NEXT_PUBLIC_WS_URL: "wss://api.goplan.io/ws"
  NEXT_PUBLIC_APP_URL: "https://goplan.io"
  NEXT_PUBLIC_APP_NAME: "GoPlan"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goplan-frontend
  namespace: goplan
  labels:
    app: goplan
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: goplan
      component: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: goplan
        component: frontend
    spec:
      serviceAccountName: goplan-frontend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: frontend
          image: ghcr.io/goplan/goplan-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: goplan-frontend-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: goplan
                    component: frontend
                topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: goplan-frontend
  namespace: goplan
  labels:
    app: goplan
    component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: goplan
    component: frontend

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: goplan-frontend
  namespace: goplan
  labels:
    app: goplan
    component: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: goplan-frontend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: goplan-frontend
  namespace: goplan
  labels:
    app: goplan
    component: frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: goplan
      component: frontend

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: goplan-frontend
  namespace: goplan
  labels:
    app: goplan
    component: frontend
